version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bankcore-db
    environment:
      POSTGRES_DB: bankcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bankcore_data:/var/lib/postgresql/data

volumes:
  bankcore_data: